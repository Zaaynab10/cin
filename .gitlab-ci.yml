stages:
  - validate
  - build
  - deploy

variables:
  NODE_VERSION: "20"

# ── Cache node_modules entre les jobs ─────────────────────────────────────────
.node_cache: &node_cache
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - node_modules/
    policy: pull

# ── Job de base Node.js ────────────────────────────────────────────────────────
.node_base: &node_base
  image: node:20-alpine
  before_script:
    - npm ci

# ─────────────────────────────────────────────────────────────────────────────
# STAGE: validate
# ─────────────────────────────────────────────────────────────────────────────
lint:
  <<: *node_base
  stage: validate
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - node_modules/
    policy: pull-push
  script:
    - cd $(pwd)
    - npm ci
    - npm run lint
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_BRANCH == "develop"

typecheck:
  <<: *node_base
  <<: *node_cache
  stage: validate
  script:
    - npm run typecheck
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_BRANCH == "develop"

# ─────────────────────────────────────────────────────────────────────────────
# STAGE: build
# ─────────────────────────────────────────────────────────────────────────────
build:
  <<: *node_base
  <<: *node_cache
  stage: build
  script:
    - npm run build
  variables:
    NEXT_PUBLIC_BACKEND_API_URL: $NEXT_PUBLIC_BACKEND_API_URL
    SESSION_SECRET: $SESSION_SECRET
  artifacts:
    paths:
      - .next/
    expire_in: 1 hour
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_BRANCH == "develop"

# ─────────────────────────────────────────────────────────────────────────────
# STAGE: deploy (production — branche main uniquement)
# ─────────────────────────────────────────────────────────────────────────────
deploy_production:
  image: node:20-alpine
  stage: deploy
  environment:
    name: production
    url: $VERCEL_PROJECT_URL
  before_script:
    - npm install --global vercel@latest
  script:
    - vercel pull --yes --environment=production --token=$VERCEL_TOKEN
    - vercel build --prod --token=$VERCEL_TOKEN
    - vercel deploy --prebuilt --prod --token=$VERCEL_TOKEN
  variables:
    VERCEL_ORG_ID: $VERCEL_ORG_ID
    VERCEL_PROJECT_ID: $VERCEL_PROJECT_ID
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
